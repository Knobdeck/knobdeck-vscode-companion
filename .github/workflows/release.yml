# Actions → Release → Run workflow (on master) releases the version in package.json: it runs CI,
# creates the tag v<version> and a GitHub release with the .vsix, then publishes it to the Visual
# Studio Marketplace and Open VSX. Re-running for a version that already has a release skips the
# release and only retries the stores (both skip a version they already have).
#
# Publishing uses Trusted Publishing (OIDC): no store tokens are stored in this repo. Both stores
# trust this file by name (release.yml) in the `release` environment, so keep the two in step
# with the policies on marketplace.visualstudio.com/manage and open-vsx.org. The store jobs must
# stay in this file (not a reusable workflow) for the same reason.
name: Release

on:
  workflow_dispatch:

concurrency: release

jobs:
  ci:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # tag and GitHub release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: knobdeck-vscode-companion
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            released=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            if [ "$released" != "$GITHUB_SHA" ]; then
              # A retry after a workflow fix lands here too, so don't fail: the stores skip what they have.
              echo "::warning::$tag was released from ${released:0:7}, not this commit. Nothing new ships unless you bump the version in package.json; retrying the stores for $tag only."
            else
              echo "::notice::$tag is already released; retrying the stores only"
            fi
            exit 0
          fi
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$tag" knobdeck-vscode-companion.vsix --target "$GITHUB_SHA" \
            --title "KnobDeck VS Code Companion $VERSION" --notes-file notes.md

  marketplace:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC token for the Marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: knobdeck-vscode-companion
      - name: Visual Studio Marketplace
        run: npx vsce publish --oidc --skip-duplicate --packagePath knobdeck-vscode-companion.vsix

  open-vsx:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC token for Open VSX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: knobdeck-vscode-companion
      - name: Open VSX
        # Trusted publishing once the publisher registered at open-vsx.org matches this workflow;
        # until then (and while it is set) the OVSX_PAT secret is used.
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish knobdeck-vscode-companion.vsix --skip-duplicate
          else
            unset OVSX_PAT
            npx ovsx publish knobdeck-vscode-companion.vsix --skip-duplicate --trusted-publishing
          fi

  catalog:
    # Tells the knobdeck-registry catalog to rebuild. Skipped until the catalog GitHub App is set up
    # (CATALOG_APP_ID variable, CATALOG_APP_PRIVATE_KEY secret). Runs even when a store job failed,
    # because the GitHub release already exists.
    needs: [release, marketplace, open-vsx]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Catalog app token
        id: app
        if: vars.CATALOG_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: Knobdeck
          repositories: knobdeck-registry
      - name: Tell the catalog
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg id "vscode" --arg version "$VERSION" \
            '{event_type: "companion-released", client_payload: {repo: $repo, id: $id, version: $version}}' |
            gh api repos/Knobdeck/knobdeck-registry/dispatches --input -
